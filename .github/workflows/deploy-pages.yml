name: Deploy Chireh website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the project site path
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          site_base = "/" + os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          quote_root = re.compile(r"""(["'])/(?!/)""")
          css_root = re.compile(r"""url\((\s*)/(?!/)""")

          for path in Path("dist").rglob("*"):
              if path.suffix.lower() not in {".html", ".js", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              text = quote_root.sub(lambda match: match.group(1) + site_base + "/", text)
              text = css_root.sub(lambda match: "url(" + match.group(1) + site_base + "/", text)
              path.write_text(text, encoding="utf-8")

          Path("dist/.nojekyll").touch()
          PY
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
